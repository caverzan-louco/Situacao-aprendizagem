<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lâmpada Interativa</title>
    <link rel="stylesheet" href="style.css"> <!--importa arquivo-->
</head>
<body>
    <div class="container"> <!--agrupamentos dos itens-->
        <div class="lamp-container"> <!--container que envolve a lâmpada-->
            <div class="lamp" id="lamp"> <!--representa a lâmpada-->
                <h1 id="lampTitle">Lâmpada</h1> <!--título da lâmpada-->
                <p id="brokenMessage" class="broken-message">A lâmpada quebrou!</p> <!--mensagem exibida quando a lâmpada quebrar-->
            </div>
        </div>
        <div class="buttons"> <!--containers para os botões-->
            <button id="onButton" class="switch-button">ON</button> <!--botão para ligar-->
            <button id="offButton" class="switch-button">OFF</button> <!--botão para desligar-->
            <button id="repairButton" class="repair-button" style="display: none;">Consertar</button> <!--botão para concertar-->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
